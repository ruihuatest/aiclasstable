<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>115AI數位行政與電商行銷實務職能訓練班-課表</title>
<style>
:root{
 --bg:#f5f7f5;--card:#fff;--line:#e1e7e1;--text:#1f2937;--muted:#6b7280;
 --green:#e3f5e6;--green-b:#abd9b3;--gray:#eceff1;--gray-b:#d0d6dc;
 --today:#fff4bf;--blue:#2563eb;--shadow:0 5px 20px rgba(15,23,42,.055)
}
*{box-sizing:border-box}html{scroll-behavior:auto}
html,body{min-height:100%;}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.app{max-width:1500px;margin:auto;padding:14px}
.page{display:none}.page.active{display:block}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 10px}
.today-label{font-size:15px;font-weight:850}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}.dot{width:12px;height:12px;border-radius:4px;border:1px solid}
.dot.g{background:var(--green);border-color:var(--green-b)}.dot.x{background:var(--gray);border-color:var(--gray-b)}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.table-wrap{overflow:auto;max-height:calc(100vh - 135px)}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:1220px}
th{position:sticky;top:0;z-index:3;background:#fafbfa;padding:13px;text-align:left;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:15px}
td{padding:12px;vertical-align:top;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}
th:last-child,td:last-child{border-right:0}tr:last-child td{border-bottom:0}
tr.today-row td{background:var(--today)}
.date-cell{width:145px;min-width:145px}.date-main{font-size:20px;font-weight:900}.date-sub{font-size:15px;color:var(--muted);margin-top:6px;font-weight:700}
.makeup{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:999px;background:#fff2c7;color:#755400;font-size:11px;font-weight:850}
.course{min-height:96px;border-radius:14px;padding:12px;background:var(--green);border:1px solid var(--green-b)}
.course.done{background:var(--gray);border-color:var(--gray-b)}
.name{font-size:19px;font-weight:900;line-height:1.4}.meta{margin-top:8px;font-size:13px;color:#52606d;line-height:1.55}
.empty{min-height:96px;border-radius:14px;border:1px dashed #d6ddd6;background:rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:14px}
.mobile{display:none}.day{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px;margin-bottom:10px}.day.today{background:var(--today)}
.day-head{display:flex;justify-content:space-between;gap:10px}.day-title{font-size:21px;font-weight:900}.badge{height:max-content;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3157d5;font-size:12px;font-weight:850;white-space:nowrap}
.m-course{margin-top:10px;border-radius:14px;padding:12px;background:var(--green);border:1px solid var(--green-b)}.m-course.done{background:var(--gray);border-color:var(--gray-b)}
.free{margin-top:10px;padding:18px;text-align:center;border-radius:14px;border:1px dashed #cfd7cf;background:rgba(255,255,255,.7);color:#667085;font-weight:850}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.stat,.block{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.stat{padding:16px}.stat .num{font-size:30px;font-weight:950}.stat .lab{margin-top:4px;color:var(--muted);font-size:13px}
.block{padding:16px}.block h2{margin:0 0 10px;font-size:19px}.notice{background:#f8faf8;border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:9px;font-size:14px;color:#4b5563;line-height:1.55}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row strong{font-size:15px}.row span{font-size:13px;color:var(--muted);text-align:right}
@media(max-width:920px){.app{padding:10px}.table-wrap{display:none}.mobile{display:block}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.tab{font-size:19px;padding:13px 8px}.stat{padding:13px}.stat .num{font-size:25px}}


/* 右下角懸浮快捷鍵 */
.floating-actions{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:9999;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}
.float-btn{font-size:16px;
  width:68px;
  height:68px;
  border-radius:50%;
  border:0;
  color:#fff;
  font-weight:900;
  line-height:1.18;
  cursor:pointer;
  box-shadow:0 14px 34px rgba(15,23,42,.22);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:7px;
  animation:floatBounce 1.9s ease-in-out infinite;
  user-select:none;
}
.float-btn.today-btn{
  background:linear-gradient(135deg,#e7a900,#c98300);
  animation-delay:.25s;
}
.float-btn.switch-btn{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
}
.float-btn:active{transform:scale(.95)}
.float-btn:focus-visible{outline:3px solid rgba(37,99,235,.25);outline-offset:3px}
@keyframes floatBounce{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-7px) scale(1.035)}
}
@media(max-width:520px){
  .floating-actions{right:13px;bottom:13px;gap:8px}
  .float-btn{width:62px;height:62px;font-size:12px}
}


/* 今天課程：黃色底色，覆蓋原本未完成綠色 / 已完成灰色 */
tr.today-row td{background:#fff4bf!important}
tr.today-row .course,
tr.today-row .course.done{
  background:#fff4bf!important;
  border-color:#e6ca57!important;
}
tr.today-row .empty{
  background:#fff9dc!important;
  border-color:#eadb91!important;
}
.day.today{background:#fff4bf!important}
.day.today .m-course,
.day.today .m-course.done{
  background:#fff4bf!important;
  border-color:#e6ca57!important;
}


/* 空課頁：只保留依日期分類的清單 */
.free-only{
  display:flex;
  flex-direction:column;
  gap:16px;
}
.free-group{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.free-group-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:16px 18px;
  border-bottom:1px solid var(--line);
  background:#fafbfa;
}
.free-group-head h2{
  margin:0;
  font-size:19px;
}
.count-badge{
  min-width:28px;
  height:28px;
  padding:0 9px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eef2ff;
  color:#3157d5;
  font-size:13px;
  font-weight:900;
}
.free-list{
  padding:0 18px;
}
.free-item{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  padding:15px 0;
  border-bottom:1px solid var(--line);
}
.free-item:last-child{border-bottom:0}
.free-item-date{
  font-size:16px;
  font-weight:900;
  white-space:nowrap;
}
.free-item-note{
  color:var(--muted);
  font-size:14px;
  text-align:right;
  line-height:1.5;
}
.free-item.today-free{
  background:#fff8d6;
  margin:0 -18px;
  padding-left:18px;
  padding-right:18px;
}
.free-empty{
  padding:24px 0;
  text-align:center;
  color:#9ca3af;
  font-size:14px;
}
@media(max-width:600px){
  .free-item{
    flex-direction:column;
    gap:5px;
  }
  .free-item-note{text-align:left}
}


.free-today-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:14px 18px;
  margin-bottom:14px;
}
.free-today-label{
  font-size:14px;
  color:var(--muted);
  font-weight:800;
}
.free-today-date{
  font-size:18px;
  font-weight:950;
}
.countdown{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-left:10px;
  padding:7px 14px;
  min-height:34px;
  border-radius:999px;
  background:#eef6ff;
  color:#1d4ed8;
  font-size:15px;
  font-weight:950;
  line-height:1;
  white-space:nowrap;
  box-shadow:0 2px 8px rgba(29,78,216,.10);
}
.countdown.today{
  background:#fff2b8;
  color:#7a5600;
}


@media(max-width:600px){
  .countdown{
    font-size:15px;
    padding:7px 13px;
    min-height:34px;
    margin-left:6px;
    margin-top:4px;
  }
}


.teacher-line{
  margin-top:10px;
  font-size:16px;
  font-weight:800;
  color:#44505f;
  line-height:1.5;
}
.period-line{
  margin-top:6px;
  font-size:16px;
  font-weight:800;
  color:#44505f;
  line-height:1.5;
}
.assistant-line{
  margin-top:4px;
  font-size:15px;
  font-weight:700;
  color:#667085;
  line-height:1.45;
}
@media(max-width:920px){
  .name{font-size:20px}
  .teacher-line,.period-line{font-size:17px}
  .assistant-line{font-size:16px}
}

</style>
</head>

</div>

nd": 7}]}, {"date": "2026-10-01", "segments": [{"course": "genai", "start": 1, "end": 7}]}, {"date": "2026-10-02", "segments": [{"course": "labor", "start": 1, "end": 7}]}, {"date": "2026-10-05", "segments": [{"course": "genai", "start": 1, "end": 7}]}, {"date": "2026-10-06", "segments": [{"course": "aippt", "start": 1, "end": 7}]}, {"date": "2026-10-07", "segments": [{"course": "multi", "start": 1, "end": 7}]}, {"date": "2026-10-08", "segments": [{"course": "multi", "start": 1, "end": 7}]}, {"date": "2026-10-09", "segments": [{"course": "office", "start": 1, "end": 7}]}, {"date": "2026-10-12", "segments": [{"course": "social", "start": 1, "end": 7}]}, {"date": "2026-10-13", "segments": [{"course": "aippt", "start": 1, "end": 7}]}, {"date": "2026-10-14", "segments": [{"course": "video", "start": 1, "end": 7}]}, {"date": "2026-10-15", "segments": [{"course": "multi", "start": 1, "end": 7}]}, {"date": "2026-10-19", "segments": [{"course": "office", "start": 1, "end": 7}]}, {"date": "2026-10-20", "segments": [{"course": "aippt", "start": 1, "end": 7}]}, {"date": "2026-10-21", "segments": [{"course": "video", "start": 1, "end": 7}]}, {"date": "2026-10-23", "segments": [{"course": "office", "start": 1, "end": 7}]}, {"date": "2026-10-27", "segments": [{"course": "aippt", "start": 1, "end": 7}]}, {"date": "2026-10-28", "segments": [{"course": "office", "start": 1, "end": 7}]}, {"date": "2026-10-29", "segments": [{"course": "video", "start": 1, "end": 7}]}, {"date": "2026-10-30", "segments": [{"course": "video", "start": 1, "end": 7}]}, {"date": "2026-11-02", "segments": [{"course": "infosec", "start": 1, "end": 7}], "makeup_from": "2026-09-18"}, {"date": "2026-11-03", "segments": [{"course": "aippt", "start": 1, "end": 7}]}, {"date": "2026-11-04", "segments": [{"course": "video", "start": 1, "end": 7}]}, {"date": "2026-11-05", "segments": [{"course": "video", "start": 1, "end": 7}]}, {"date": "2026-11-06", "segments": [{"course": "video", "start": 1, "end": 7}]}, {"date": art": "2026-09-14", "end": "2026-11-27"}, "verification": {"sourceImages": 9, "sourceClassDays": 47, "finalClassDays": 47, "weekdays": 55, "freeDays": 8, "totalPeriods": 326, "movedFrom": "2026-09-18", "movedTo": "2026-11-02"}};
const DAY=['日','一','二','三','四','五','六'];
const MAP=new Map(DATA.schedule.map(x=>[x.date,x]));

function info(){
 const n=new Date();
 return {now:n,date:`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`};
}
function roc(s){const d=new Date(s+'T00:00:00');return `${d.getFullYear()-1911}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`}
function week(s){return `星期${DAY[new Date(s+'T00:00:00').getDay()]}`}
function segAt(day,p){return day?.segments.find(s=>p>=s.start&&p<=s.end)||null}
function assist(seg,c){return Object.prototype.hasOwnProperty.call(seg||{},'assistant_override')?seg.assistant_override:(c.assistant||'')}
function status(date,p){
 const {now,date:today}=info();
 if(date<today)return'done'; if(date>today)return'pending';
 const [h,m]=DATA.periods[p-1].end.split(':').map(Number);
 const e=new Date(now);e.setHours(h,m,0,0);
 return now>=e?'done':'pending';
}
function buildHead(){
 DATA.periods.forEach(p=>{
  const th=document.createElement('th');
  th.innerHTML=`第${p.n}節<br><span style="font-size:13px;color:#64748b;font-weight:600">${p.start}–${p.end}</span>`;
  document.getElementById('head').appendChild(th);
 })
}
function build(){
 const {date:today}=info();
 document.getElementById('todayLabel').textContent=`今天：${roc(today)}（${week(today)}）`;
 const body=document.getElementById('body'),mobile=document.getElementById('mobile');
 body.innerHTML='';mobile.innerHTML='';
 let exactD=null,exactM=null,nextD=null,nextM=null;

 DATA.weekdays.forEach(ds=>{
  const day=MAP.get(ds)||null;
  const tr=document.createElement('tr'); tr.dataset.date=ds;
  if(ds===today)tr.classList.add('today-row');

  let mk=day?.makeup_from?`<div class="makeup">補課｜原 ${roc(day.makeup_from)}</div>`:'';
  const td0=document.createElement('td');td0.className='date-cell';
  td0.innerHTML=`<div class="date-main">${roc(ds)}</div><div class="date-sub">${week(ds)}</div>${mk}`;
  tr.appendChild(td0);

  DATA.periods.forEach(p=>{
   const td=document.createElement('td'),seg=segAt(day,p.n);
   if(seg){
    const c=DATA.courses[seg.course],a=assist(seg,c);
    td.innerHTML=`<div class="course ${status(ds,p.n)==='done'?'done':''}">
      <div class="name">${c.name}</div>
      <div class="teacher-line">教師：${c.teacher}</div>
      ${a?`<div class="assistant-line">助教：${a}</div>`:''}
      <div class="period-line">第${p.n}節｜${p.start}–${p.end}</div>
    </div>`;
   }else td.innerHTML='<div class="empty">無課</div>';
   tr.appendChild(td);
  });
  body.appendChild(tr);

  const card=document.createElement('article');card.className='day'+(ds===today?' today':'');card.dataset.date=ds;
  card.innerHTML=`<div class="day-head"><div><div class="day-title">${roc(ds)}</div><div class="date-sub">${week(ds)}</div></div><span class="badge">${ds===today?'今天・':''}${day?(day.makeup_from?'補課':'上課日'):'無課'}</span></div>`;
  if(day){
   if(day.makeup_from){
    const n=document.createElement('div');n.className='makeup';n.textContent=`原 ${roc(day.makeup_from)} 課程移至本日`;card.appendChild(n)
   }
   day.segments.forEach(seg=>{
    const c=DATA.courses[seg.course],a=assist(seg,c),b=document.createElement('div');
    b.className='m-course '+(status(ds,seg.end)==='done'?'done':'');
    b.innerHTML=`<div class="name">${c.name}</div>
      <div class="teacher-line">教師：${c.teacher}</div>
      ${a?`<div class="assistant-line">助教：${a}</div>`:''}
      <div class="period-line">第${seg.start}${seg.start!==seg.end?'～'+seg.end:''}節｜${DATA.periods[seg.start-1].start}–${DATA.periods[seg.end-1].end}</div>`;
    card.appendChild(b)
   })
  }else{
   const f=document.createElement('div');f.className='free';f.textContent='全天無課';card.appendChild(f)
  }
  mobile.appendChild(card);

  if(ds===today){exactD=tr;exactM=card}
  if(!nextD&&ds>today){nextD=tr;nextM=card}
 });

 const dTarget=exactD||nextD||body.lastElementChild,mTarget=exactM||nextM||mobile.lastElementChild;
 setTimeout(()=>{
  if(window.innerWidth<=920)mTarget?.scrollIntoView({block:'start',behavior:'auto'});
  else if(dTarget){const w=document.getElementById('desktopWrap');w.scrollTop=Math.max(0,dTarget.offsetTop-65)}
 },40);
}
function buildStats(){
  const {date:today}=info();

  // 空課頁第一列顯示今天日期
  const freeTodayDate=document.getElementById('freeTodayDate');
  if(freeTodayDate){
    freeTodayDate.textContent=`${roc(today)}（${week(today)}）`;
  }

  // 全日空課 + 9/14 的部分空課
  const freeItems = DATA.freeDates.map(s=>({
    date:s,
    note:s==='2026-09-18'
      ? '全天空課｜原課程已移至 11/02 補課'
      : '全天空課｜09:10–17:00'
  }));

  freeItems.push({
    date:'2026-09-14',
    note:'部分空課｜第5～7節無課，14:00 後不用上課'
  });

  // 計算從今天到目標日期還有幾天（依本地日期，不受時區小時影響）
  function daysUntil(targetDate){
    const [ty,tm,td]=today.split('-').map(Number);
    const [yy,mm,dd]=targetDate.split('-').map(Number);
    const a=Date.UTC(ty,tm-1,td);
    const b=Date.UTC(yy,mm-1,dd);
    return Math.round((b-a)/86400000);
  }

  // 未實現：今天與未來；依日期由近到遠
  const futureItems = freeItems
    .filter(x=>x.date>=today)
    .sort((a,b)=>a.date.localeCompare(b.date));

  // 已實現：過去日期；最近的過去日期排前面
  const pastItems = freeItems
    .filter(x=>x.date<today)
    .sort((a,b)=>b.date.localeCompare(a.date));

  function renderFutureList(targetId, items){
    const el=document.getElementById(targetId);
    if(!items.length){
      el.innerHTML='<div class="free-empty">目前沒有未實現空課</div>';
      return;
    }

    el.innerHTML=items.map(item=>{
      const diff=daysUntil(item.date);
      const isToday=diff===0;
      const countdownText=isToday?'今天':`倒數 ${diff} 天`;
      return `<div class="free-item ${isToday?'today-free':''}">
        <div class="free-item-date">
          ${roc(item.date)}（${week(item.date).replace('星期','週')}）
          <span class="countdown ${isToday?'today':''}">${countdownText}</span>
        </div>
        <div class="free-item-note">${item.note}</div>
      </div>`;
    }).join('');
  }

  function renderPastList(targetId, items){
    const el=document.getElementById(targetId);
    if(!items.length){
      el.innerHTML='<div class="free-empty">目前沒有已實現空課</div>';
      return;
    }

    el.innerHTML=items.map(item=>`
      <div class="free-item">
        <div class="free-item-date">${roc(item.date)}（${week(item.date).replace('星期','週')}）</div>
        <div class="free-item-note">${item.note}</div>
      </div>
    `).join('');
  }

  document.getElementById('futureFreeCount').textContent=futureItems.length;
  document.getElementById('pastFreeCount').textContent=pastItems.length;
  renderFutureList('futureFreeList', futureItems);
  renderPastList('pastFreeList', pastItems);
}
buildHead();buildStats();build();

function focusTodayCourse(){
  const {date:today}=info();
  const desktopRow=document.querySelector(`#body tr[data-date="${today}"]`);
  const mobileCard=document.querySelector(`#mobile .day[data-date="${today}"]`);

  if(window.innerWidth<=920){
    if(mobileCard) mobileCard.scrollIntoView({block:'start',behavior:'smooth'});
  }else{
    const wrap=document.getElementById('desktopWrap');
    if(desktopRow && wrap){
      wrap.scrollTo({top:Math.max(0,desktopRow.offsetTop-65),behavior:'smooth'});
    }
  }
}

function setPage(target){
  const schedulePage=document.getElementById('schedulePage');
  const statsPage=document.getElementById('statsPage');
  const switchBtn=document.getElementById('switchPageBtn');
  const todayBtn=document.getElementById('todayCourseBtn');

  const isSchedule=target==='schedulePage';
  schedulePage.classList.toggle('active',isSchedule);
  statsPage.classList.toggle('active',!isSchedule);

  if(isSchedule){
    switchBtn.innerHTML='切換<br>空課';
    switchBtn.setAttribute('aria-label','切換空課');
    todayBtn.style.display='flex';
    build();
  }else{
    switchBtn.innerHTML='切換<br>課表';
    switchBtn.setAttribute('aria-label','切換課表');
    todayBtn.style.display='none';
    buildStats();
    window.scrollTo({top:0,behavior:'auto'});
  }
}

document.getElementById('switchPageBtn').addEventListener('click',()=>{
  const onSchedule=document.getElementById('schedulePage').classList.contains('active');
  setPage(onSchedule?'statsPage':'schedulePage');
});

document.getElementById('todayCourseBtn').addEventListener('click',()=>{
  focusTodayCourse();
});


</script>
